name: Sync LinkedIn posts from Buffer
run-name: Posts sync (${{ inputs.source || github.event_name }})

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Origin of the dispatch
        type: string
        default: manual

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-linkedin-posts
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Restore Buffer channel lookup
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/portfolio-buffer-channel.json
          key: portfolio-buffer-linkedin-channel-v1

      - name: Fetch published LinkedIn posts and update the index
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 .github/scripts/sync_buffer_posts.py

      - name: Save new links to the archive
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync LinkedIn posts from Buffer'
          git push origin HEAD:main

      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_SYNC: ${{ github.event_name == 'schedule' || inputs.source == 'cloudflare-cron' }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pages/builds"
          if [[ "$AUTOMATIC_SYNC" == "true" ]]; then
            latest=$(gh api "$endpoint/latest" --jq '[.commit, .status] | join(" ")')
            read -r commit status <<< "$latest"
            if [[ "$commit" == "$(git rev-parse HEAD)" && "$status" != "errored" ]]; then
              exit 0
            fi
          fi
          # A commit pushed with GITHUB_TOKEN does not trigger a Pages build.
          gh api --method POST "$endpoint" --jq .status
